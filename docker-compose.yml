name: google-drive-audio-player

services:
  # Development services
  react:
    profiles: ["dev"]
    container_name: gdap-react-dev
    build:
      context: ./react_page
      dockerfile: Dockerfile.dev
      args:
        VITE_APP_API_ADDRESS: http://127.0.0.1:8000/api/
    ports:
      - "5173:5173"
    volumes:
      - ./react_page:/app
      - /app/node_modules

  django:
    profiles: ["dev"]
    container_name: gdap-django-dev
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    depends_on:
      - db-dev
    env_file:
      - ./.env.dev
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=./service_key.json

  db-dev:
    profiles: ["dev"]
    container_name: gdap-db-dev
    image: postgres:15
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
    env_file:
      - ./.env.dev

  # Production services
  web:
    profiles: ["prod"]
    container_name: gdap-web
    build:
      context: .
      dockerfile: ./app/Dockerfile.prod
      args:
        VITE_APP_API_ADDRESS: http://127.0.0.1:1337/api/
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/home/app/web/staticfiles
      - media_volume:/home/app/web/audio_player/media/profile_pics
    expose:
      - 8000
    env_file:
      - ./.env.prod
    depends_on:
      - db

  db:
    profiles: ["prod"]
    container_name: gdap-db
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env.prod

  nginx:
    profiles: ["prod"]
    container_name: gdap-nginx
    build: ./nginx
    volumes:
      - static_volume:/home/app/web/staticfiles
      - media_volume:/home/app/web/audio_player/media/profile_pics
    ports:
      - 1337:80
    depends_on:
      - web

networks:
  default:
    name: gdap-network
    driver: bridge

volumes:
  postgres_data_dev:
  postgres_data:
  static_volume:
  media_volume:
